<!DOCTYPE html>

    <title>Ejemplo de Selectores</title>

<body>

    <h1>Demostración de Selectores</h1>

    <p>Demostración "::first-letter"</p>

    <hr>

    <div>
        <p>Demostración "div > p"</p>
        <p>Hijo div</p>
        <span>
            <p>Texto fuera del div</p>
        </span>
    </div>

    <hr>

    <a href="https://youtube.com" target="_blank">Selector de atributo</a>
    <br><br>
    <button>Pseudoclase</button>

</body>
